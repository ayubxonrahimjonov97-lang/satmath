{% extends "layout.html" %}
{% block title %}
    Log in
{% endblock %}

{% block main %}
    <form action = "/login" method = "POST">
        <div class="mb-3">
            <input
                autocomplete = "off"
                autofocus
                class="form-control mx-auto w-auto"
                placeholder="Username"
                name = "username"
                type="text">
        </div>

        <div class="mb-3">
            <input
                class="form-control mx-auto w-auto"
                placeholder="Password"
                name = "password"
                type="password">
        </div>


        <button class = "btn btn-primary" type = "submit">Log in</button>
    </form>
{% endblock %}
