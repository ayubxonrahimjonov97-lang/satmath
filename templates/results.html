{% extends "layout.html" %}

{% block main %}

    <h1>Practice Complete!</h1>

    <h2>{{ score }} / {{ total }}</h2>

    <h3>{{ percentage }}%</h3>

    <p>{{ domain }} Practice</p>

    <hr>

    <div>
        <h3>Correct</h3>
        <p>{{ score }}</p>
    </div>

    <div>
        <h3>Incorrect</h3>
        <p>{{ total - score }}</p>
    </div>

    <hr>

    <a href="{{ url_for('practice') }}">
        Practice Again
    </a>

{% endblock %}
